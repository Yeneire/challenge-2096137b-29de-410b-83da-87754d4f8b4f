yaml
version: '3.8'

services:
postgres:
image: postgres:15-alpine
container_name: bank_db
environment:
POSTGRES_DB: bank_accounts
POSTGRES_USER: postgres
POSTGRES_PASSWORD: secure_password
ports:
• "5432:5432"
volumes:
• postgres_data:/var/lib/postgresql/data
healthcheck:
test: ["CMD-SHELL", "pg_isready -U postgres"]
interval: 10s
timeout: 5s
retries: 5

api:
build: .
container_name: bank_api
environment:
API_PORT: 8080
API_ENV: production
DB_HOST: postgres
DB_PORT: 5432
DB_NAME: bank_accounts
DB_USER: postgres
DB_PASSWORD: secure_password
LOG_LEVEL: info
RATE_LIMIT_REQUESTS: 1000
RATE_LIMIT_WINDOW: 60
ports:
• "8080:8080"
depends_on:
postgres:
condition: service_healthy
volumes:
• ./logs:/app/logs
restart: unless-stopped

volumes:
postgres_data: